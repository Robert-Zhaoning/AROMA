[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aroma"
version = "0.1.0"
description = "AROMA: Adaptive Routing of Mechanistic Actuators with Causal Subspace Control for Vision-Language Counting"
readme = "README.md"
requires-python = ">=3.11"
authors = [
{ name = "Zhaoning Zhang" },
]
dependencies = [
"numpy",
"pandas",
"scipy",
"scikit-learn",
"pillow",
"pyyaml",
"tqdm",
"matplotlib",
]

[project.urls]
Repository = "https://github.com/Robert-Zhaoning/AROMA"
Issues = "https://github.com/Robert-Zhaoning/AROMA/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
